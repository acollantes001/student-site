
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header text-center">
          <h2 class="mb-0">{{ formTitle }}</h2>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()" #teacherForm="ngForm">
            <input type="hidden" name="teacherId" [(ngModel)]="currentTeacher.teacherId" />
            
            <label for="teacherName" class="form-label">Teacher Name</label>
            <input
              type="text"
              class="form-control"
              id="teacherName"
              name="teacherName"
              [(ngModel)]="currentTeacher.teacherName"
              required
              maxlength="10"
            />

            <label for="subject" class="form-label">Subject</label>
            <input
              type="text"
              class="form-control"
              id="subject"
              name="subject"
              [(ngModel)]="currentTeacher.subject"
              required
            />

            <label for="mobileNo" class="form-label">Mobile Number</label>
            <input
              type="tel"
              class="form-control"
              id="mobileNo"
              name="mobileNo"
              [(ngModel)]="currentTeacher.mobileNo"
              required
            />

            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              [(ngModel)]="currentTeacher.email"
              required
            />

            <label for="address" class="form-label">Address</label>
            <input
              type="text"
              class="form-control"
              id="address"
              name="address"
              [(ngModel)]="currentTeacher.address"
            />

            <label for="city" class="form-label">City</label>
            <input
              type="text"
              class="form-control"
              id="city"
              name="city"
              [(ngModel)]="currentTeacher.city"
            />

            <label for="state" class="form-label">State</label>
            <input
              type="text"
              class="form-control"
              id="state"
              name="state"
              [(ngModel)]="currentTeacher.state"
            />

            <label for="zipCode" class="form-label">Zip Code</label>
            <input
              type="text"
              class="form-control"
              id="zipCode"
              name="zipCode"
              [(ngModel)]="currentTeacher.zipCode"
            />

            <button type="submit" class="btn btn-primary mt-3">Submit</button>
            <button type="button" class="btn btn-secondary mt-3" (click)="resetForm()">Reset</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
